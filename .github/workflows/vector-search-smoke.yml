name: Vector search smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'init_db.py'
      - 'seed.py'
      - 'requirements.txt'
      - '.github/workflows/vector-search-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'init_db.py'
      - 'seed.py'
      - 'requirements.txt'
      - '.github/workflows/vector-search-smoke.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vector_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vector_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vector_demo
      HF_HOME: /tmp/huggingface-cache
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize pgvector schema
        run: python init_db.py
      - name: Seed sample documents and embeddings
        run: python seed.py
      - name: Verify documents and vector search
        run: |
          python - <<'PY'
          import os
          import psycopg
          from pgvector.psycopg import register_vector
          from sentence_transformers import SentenceTransformer
          from datetime import datetime, timedelta, timezone

          url = os.environ["DATABASE_URL"]
          model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")
          query = "How can I secure an API?"
          vector = model.encode(query, normalize_embeddings=True).tolist()
          with psycopg.connect(url) as conn:
              register_vector(conn)
              total = conn.execute("SELECT count(*) FROM documents").fetchone()[0]
              rows = conn.execute(
                  """
                  SELECT content, metadata->>'category' AS category,
                         1 - (embedding <=> %s) AS similarity
                  FROM documents
                  ORDER BY embedding <=> %s
                  LIMIT 5
                  """,
                  (vector, vector)
              ).fetchall()
          print(f"Seeded document count: {total}")
          print("Top semantic matches:")
          for content, category, score in rows:
              print(f"- [{category}] similarity={float(score):.4f}: {content}")
          if total < 10 or not rows:
              raise SystemExit("Smoke test failed: expected at least 10 documents and search results.")
          print("PASS: pgvector semantic search returned results.")
          PY
      - name: Validate Streamlit app syntax
        run: python -m compileall -q app.py init_db.py seed.py
