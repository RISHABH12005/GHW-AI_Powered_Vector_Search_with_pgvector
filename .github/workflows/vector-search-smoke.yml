name: Vector search smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'init_db.py'
      - 'seed.py'
      - 'requirements.txt'
      - '.github/workflows/vector-search-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'init_db.py'
      - 'seed.py'
      - 'requirements.txt'
      - '.github/workflows/vector-search-smoke.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vector_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vector_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vector_demo
      HF_HOME: /tmp/huggingface-cache
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize pgvector schema
        run: python init_db.py
      - name: Seed sample documents and embeddings
        run: python seed.py
      - name: Verify documents and vector search
        run: python .github/scripts/smoke_test.py
      - name: Validate Streamlit app syntax
        run: python -m compileall -q app.py init_db.py seed.py
