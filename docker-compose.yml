services:
  db:
    image: timescale/timescaledb-ha:pg17
    container_name: tigerdata-vector-demo
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector_demo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vector_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/home/postgres/pgdata/data

volumes:
  pgdata:
